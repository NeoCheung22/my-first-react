<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta 
        name="description"
        content="React Shopping Cart Demo"
    />
    <title>React 購物車 demo</title>
    <link rel="stylesheet" href="%PUBLIC_URL%/style.css">
</head>
<body>
    <div id="app"></div>
<script type="text/babel">

const App = () => {
    const a = "React 入門課程";

    const handleClick = (event) => {
        console.log("點擊了");
        console.log(event);
    }

    return (
        <div>
            <h1>Hello World</h1>
            <p className="text">This is my first React App</p>
            <p>{a.slice(5)}</p>

            <button onClick= {() => console.log("checked")}>按鈕1</button>
            <p></p>

            <button onClick= {handleClick}>按鈕2</button>
        </div>
    )
}// App 
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);

</script>
